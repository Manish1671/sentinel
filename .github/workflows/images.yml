name: images

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile
          - name: ingestion
            file: services/ingestion/Dockerfile
          - name: detection
            file: services/detection/Dockerfile
          - name: incident
            file: services/incident/Dockerfile
          - name: ai
            file: services/ai/Dockerfile
          - name: remediation
            file: services/remediation/Dockerfile
          - name: web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ vars.PUSH_IMAGES == 'true' && github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ vars.PUSH_IMAGES == 'true' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sentinel-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sentinel-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
