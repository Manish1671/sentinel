# Copy to secret.yaml (gitignored) and apply before workloads.
# Do not put long-lived AWS access keys here; use IRSA for S3.
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@RDS_ENDPOINT:5432/sentinel?sslmode=require"
  REDIS_URL: "redis://ELASTICACHE_ENDPOINT:6379/0"
  AUTH_TOKEN_SECRET: "generate-a-long-random-secret"
  AI_API_KEY: ""
