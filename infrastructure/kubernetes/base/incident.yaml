apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident
  namespace: sentinel
  labels:
    app.kubernetes.io/name: incident
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incident
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident
        app.kubernetes.io/part-of: sentinel
    spec:
      serviceAccountName: sentinel-incident
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: incident
          image: sentinel/incident:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8092
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          env:
            - name: PORT
              value: "8092"
            - name: OTEL_SERVICE_NAME
              value: sentinel-incident
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 18
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: incident
  namespace: sentinel
  labels:
    app.kubernetes.io/name: incident
spec:
  selector:
    app.kubernetes.io/name: incident
  ports:
    - name: http
      port: 8092
      targetPort: http
