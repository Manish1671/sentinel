apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentinel
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - rbac.yaml
  - configmap.yaml
  - api.yaml
  - ingestion.yaml
  - detection.yaml
  - incident.yaml
  - ai.yaml
  - remediation.yaml
  - web.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: sentinel
    includeSelectors: true
