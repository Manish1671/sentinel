apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: sentinel
  labels:
    app.kubernetes.io/name: ai
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai
        app.kubernetes.io/part-of: sentinel
    spec:
      serviceAccountName: sentinel-ai
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: ai
          image: sentinel/ai:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          env:
            - name: PORT
              value: "8000"
            - name: OTEL_SERVICE_NAME
              value: sentinel-ai
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 24
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: sentinel
  labels:
    app.kubernetes.io/name: ai
spec:
  selector:
    app.kubernetes.io/name: ai
  ports:
    - name: http
      port: 8000
      targetPort: http
