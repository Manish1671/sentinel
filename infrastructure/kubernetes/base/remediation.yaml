apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation
  namespace: sentinel
  labels:
    app.kubernetes.io/name: remediation
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remediation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remediation
        app.kubernetes.io/part-of: sentinel
    spec:
      serviceAccountName: sentinel-remediation
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: remediation
          image: sentinel/remediation:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8093
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          env:
            - name: PORT
              value: "8093"
            - name: OTEL_SERVICE_NAME
              value: sentinel-remediation
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 18
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: remediation
  namespace: sentinel
  labels:
    app.kubernetes.io/name: remediation
spec:
  selector:
    app.kubernetes.io/name: remediation
  ports:
    - name: http
      port: 8093
      targetPort: http
