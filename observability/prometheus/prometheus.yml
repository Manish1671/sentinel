global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: ingestion
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion:8090"]
        labels:
          sentinel_component: ingestion

  - job_name: detection
    metrics_path: /metrics
    static_configs:
      - targets: ["detection:8091"]
        labels:
          sentinel_component: detection

  - job_name: incident
    metrics_path: /metrics
    static_configs:
      - targets: ["incident:8092"]
        labels:
          sentinel_component: incident

  - job_name: ai
    metrics_path: /metrics
    static_configs:
      - targets: ["ai:8000"]
        labels:
          sentinel_component: ai

  - job_name: remediation
    metrics_path: /metrics
    static_configs:
      - targets: ["remediation:8093"]
        labels:
          sentinel_component: remediation

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          sentinel_component: api
